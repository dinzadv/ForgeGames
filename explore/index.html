<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link class="forgegames-logo-ref" rel="icon" type="image/png" href="../img/logo.png">
    <title>Explorar - ForgeGames</title>
    <link rel="stylesheet" href="../css/pixel.css">
    <link rel="stylesheet" href="../css/explore.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" crossorigin="anonymous"></script>
    <script src="../js/db.js"></script>
    <script src="../js/mcshared.js"></script>
</head>
<body>

    <header class="header">
        <div class="header-izquierda">
            <img src="../img/logo.png" alt="ForgeGames Logo" class="logo" id="logoInicio">
            <span class="header-titulo-pagina">Explorar</span>
        </div>

        <div class="perfil-contenedor" id="perfilBtn">
            <svg viewBox="0 0 24 24" id="perfilIconSvg"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
    </header>

    <aside class="sidebar" id="sidebarMenu">
        <div class="sidebar-cuenta-estado" id="contenedorAutenticacion">
            <span class="cuenta-anonima-texto">Disfruta de ForgeGames al máximo creando una cuenta.</span>
            <div class="sidebar-auth-botones">
                <a id="btnAuthLoginMenu" href="../login/" class="btn-auth-login">Entrar</a>
                <a id="btnAuthRegistroMenu" href="../register/" class="btn-auth-registro">Registro</a>
            </div>
        </div>

        <div class="sidebar-divisor"></div>

        <a id="menuLinkInicio" href="../" class="btn-sidebar">
            <div class="btn-sidebar-contenido">
                <svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                <span>Inicio</span>
            </div>
        </a>
        <a id="menuLinkCategorias" href="../#categorias" class="btn-sidebar">
            <div class="btn-sidebar-contenido">
                <svg viewBox="0 0 24 24"><path d="M4 5h7v7H4zm10 0h7v7h-7zM4 14h7v7H4zm10 0h7v7h-7z" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span>Categorías</span>
            </div>
        </a>
        <a id="menuLinkExplorar" href="../explore/" class="btn-sidebar activo-link">
            <div class="btn-sidebar-contenido">
                <svg viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                <span>Explorar</span>
            </div>
        </a>
        <a id="menuLinkModelos" href="../#categoria-modelos" class="btn-sidebar">
            <div class="btn-sidebar-contenido">
                <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
                <span>Modelos</span>
            </div>
        </a>
        <a id="menuLinkSprites" href="../#categoria-sprites" class="btn-sidebar">
            <div class="btn-sidebar-contenido">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
                <span>Sprites/Menús</span>
            </div>
        </a>
        <a href="../#categoria-servidores" class="btn-sidebar" id="menuLinkServidores">
            <div class="btn-sidebar-contenido">
                <svg viewBox="0 0 24 24"><path d="M4 14h16v7H4zm0-10h16v7H4zM6 7h.01M6 17h.01" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span>Servidores</span>
            </div>
        </a>

        <div class="sidebar-divisor"></div>

        <a href="../profile/" class="btn-sidebar" id="menuLinkPerfil">
            <div class="btn-sidebar-contenido">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span>Perfil</span>
            </div>
        </a>
        <a href="#" class="btn-sidebar deshabilitado" id="menuLinkFavoritos">
            <div class="btn-sidebar-contenido">
                <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
                <span>Favoritos</span>
            </div>
        </a>
        <div class="sidebar-divisor"></div>

        <div class="sidebar-redes-fila">
            <a href="https://discord.gg/9EkhYdV325" class="btn-red-cuadrado" title="Discord">
                <svg viewBox="0 0 127.14 96.36"><path d="M107.7,8.07A105.15,105.15,0,0,0,77.26,0a77.19,77.19,0,0,0-3.3,6.83A96.67,96.67,0,0,0,53.22,6.83,77.19,77.19,0,0,0,49.88,0,105.15,105.15,0,0,0,19.44,8.07C3.66,31.58-1.86,54.65,1,77.53A105.73,105.73,0,0,0,32,96.36a74.37,74.37,0,0,0,6.77-11,68.43,68.43,0,0,1-10.75-5.13c.91-.66,1.8-1.34,2.65-2a75.58,75.58,0,0,0,72.93,0c.85.69,1.74,1.37,2.65,2A68.44,68.44,0,0,1,96.1,85.37a74.49,74.49,0,0,0,6.77,11,105.73,105.73,0,0,0,31.06-18.83C130.1,49.22,124.27,26.4,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53S36.18,40.36,42.45,40.36,53.88,46,53.88,53,48.72,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.24,60,73.24,53S78.41,40.36,84.69,40.36,96.12,46,96.12,53,91,65.69,84.69,65.69Z"/></svg>
                <span>Discord</span>
            </a>
            <a href="https://www.tiktok.com/@mcpixelmx?_r=1&_t=ZS-97XdPkGNtKP" class="btn-red-cuadrado" title="TikTok">
                <svg viewBox="0 0 448 512"><path d="M448 209.9a210.1 210.1 0 0 1 -122.8-39.3V349.4A162.6 162.6 0 1 1 185 188.3V278.2a74.6 74.6 0 1 0 52.2 71.2V0l88 0a121.2 121.2 0 0 0 1.9 22.2h0A122.2 122.2 0 0 0 381 102.4a121.4 121.4 0 0 0 67 20.1z"/></svg>
                <span>TikTok</span>
            </a>
        </div>

        <button class="sidebar-toggle-pc" id="toggleCollapseBtn">
            <svg viewBox="0 0 24 24" id="collapseIcon"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
    </aside>

    <main class="contenedor-principal">
        <div class="explorar-contenedor">
            <div class="buscador-contenedor">
                <div class="buscador-input-wrapper">
                    <input type="text" class="buscador-input" id="buscadorInput" placeholder=" " autocomplete="off">
                    <svg class="buscador-icono" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <span class="buscador-placeholder-animado" id="placeholderAnimado">Buscar: Motosierras</span>

                    <div class="buscador-busquedas-recientes" id="busquedasRecientes">
                        <div class="busqueda-reciente-titulo">Búsquedas recientes</div>
                        <div id="listaBusquedasRecientes"></div>
                    </div>
                </div>

                <div class="filtro-wrapper">
                    <button class="filtro-btn-cuadrado" id="btnFiltrosDropdown" title="Filtrar por">
                        <svg viewBox="0 0 24 24"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
                    </button>
                    <div class="filtro-dropdown" id="filtroDropdownMenu">
                        <div class="filtro-opcion seleccionada" data-sort="defecto">
                            <span>Por Defecto (Aleatorio)</span>
                            <svg class="icono-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
                        </div>
                        <div class="filtro-opcion" data-sort="reciente">
                            <span>Más Reciente</span>
                            <svg class="icono-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
                        </div>
                        <div class="filtro-opcion" data-sort="actualizado">
                            <span>Más Actualizado</span>
                            <svg class="icono-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
                        </div>
                        <div class="filtro-opcion" data-sort="valorados">
                            <span>Mejor Valorados</span>
                            <svg class="icono-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
                        </div>
                        <div class="filtro-opcion" data-sort="descargados">
                            <span>Más Descargados</span>
                            <svg class="icono-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
                        </div>
                    </div>
                </div>
            </div>

            <div class="filtros-tipo" id="filtrosTipo">
                <button type="button" class="chip-tipo-filtro activo" data-tipo="todos">Todo</button>
                <button type="button" class="chip-tipo-filtro" data-tipo="addon">Add-Ons</button>
                <button type="button" class="chip-tipo-filtro" data-tipo="modelo">Modelos</button>
                <button type="button" class="chip-tipo-filtro" data-tipo="sprites">Sprites/Menús</button>
                <button type="button" class="chip-tipo-filtro" data-tipo="servidor">Servidores</button>
            </div>

            <div class="filtros-tabs">
                <button class="filtro-tab activo" data-tab="addons">
                    <span>Complementos</span>
                    <span class="badge-cantidad" id="badgeAddons">0</span>
                </button>
                <button class="filtro-tab" data-tab="usuarios">
                    <span>Usuarios</span>
                    <span class="badge-cantidad" id="badgeUsuarios">0</span>
                </button>
            </div>

            <div class="resultados-contenedor">
                <div id="quisisteDecirContenedor"></div>
                <div class="grid-resultados" id="resultadosGrid"></div>
                <div id="recomendadosContenedor"></div>
            </div>
        </div>
    </main>

    <script src="../js/explore.js"></script>
</body>
</html>
